<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tuxedo Cat Coffee</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .menu { display:flex; gap:1rem; align-items:flex-start; }
    .thumbs { display:flex; gap:0.75rem; flex-wrap:wrap; max-width:420px; }
    .thumbs img { width:110px; height:90px; object-fit:cover; cursor:pointer; border-radius:8px; border:2px solid transparent }
    .thumbs img:hover { transform:translateY(-4px); box-shadow:0 8px 20px rgba(15,23,42,0.08); border-color:rgba(34,197,94,0.2) }
    .preview { width:300px; min-height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#fff; border-radius:12px; border:1px solid rgba(15,23,42,0.06); padding:0.5rem }
    .preview p.desc { margin:0.6rem 0 0; color:#475569; font-size:0.95rem; text-align:center; max-width:90% }
    .order { margin-top:1rem; display:flex; flex-direction:column; align-items:center }
    .order-list { list-style:none; padding:0; margin:0; width:100%; max-width:260px }
    .order-list li { padding:0.4rem 0; border-bottom:1px dashed #eee; display:flex; gap:8px; align-items:center }
    .order-list .qty { background:#eef7ff; padding:4px 8px; border-radius:6px; font-weight:600 }
    .order-list button.qty-btn { border:1px solid #e6eefc; background:#fff; padding:4px 8px; border-radius:6px; cursor:pointer }
    .order-list button.remove { margin-left:auto; background:transparent; border:0; color:#ef4444; cursor:pointer }
    .order p.total { font-size:1.05rem; margin:0.6rem 0 0; text-align:center }
    .controls { margin-top:1rem; display:flex; gap:0.5rem }
    .controls button { min-width:120px }
    .cat-illustration img { width:96px; height:96px; object-fit:cover; border-radius:12px }
    .preview img.header-photo { width:100%; height:auto; border-radius:10px }
  </style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <div class="cat-illustration" aria-hidden="true">
        <!-- Use external photo placed at assets/tuxedo_cat.png (transparent or white background recommended) -->
        <img src="assets/tuxedo_cat.png" alt="Tuxedo Cat" width="96" height="96" onerror="this.style.display='none'; const sv=this.parentNode.querySelector('svg'); if(sv) sv.style.display='block';" />
        <!-- fallback stylized SVG (hidden by default) -->
        <svg viewBox="0 0 120 120" width="96" height="96" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true" style="display:none">
          <g fill="#0b0b0b">
            <path d="M26 28 L16 8 L36 20 Z"/>
            <path d="M94 28 L104 8 L84 20 Z"/>
            <circle cx="60" cy="46" r="30"/>
          </g>
          <path d="M46 42 Q60 24 74 42 Q72 66 60 70 Q48 66 46 42 Z" fill="#fff"/>
          <ellipse cx="52" cy="50" rx="3.5" ry="5" fill="#112"/>
          <ellipse cx="68" cy="50" rx="3.5" ry="5" fill="#112"/>
          <path d="M60 60 L57 64 L63 64 Z" fill="#c53030"/>
          <path d="M57 66 Q60 69 63 66" stroke="#374151" stroke-width="0.9" fill="none" stroke-linecap="round"/>
          <path d="M36 80 Q60 100 84 80 L72 118 L48 118 Z" fill="#0b0b0b"/>
          <path d="M54 74 L66 74 L66 104 L54 104 Z" fill="#fff" rx="2"/>
          <g fill="#111827">
            <path d="M60 76 L52 86 L60 88 Z"/>
            <path d="M60 76 L68 86 L60 88 Z"/>
          </g>
        </svg>
      </div>
      <div>
        <h1>Tuxedo Cat Coffee</h1>
        <p class="subtitle">Hover over a menu item to see the description</p>
      </div>
    </div>

    <div class="menu">
      <div>
        <div class="thumbs" id="thumbs"></div>
      </div>

      <div style="margin-left:1rem">
        <div class="preview" id="preview">Hover over a menu item to see the description</div>
        <div class="order">
          <h3>Your Order</h3>
          <ul class="order-list" id="orderList"></ul>
          <p><strong>Total: $<span id="orderTotal">0.00</span></strong></p>
          <div class="controls">
            <button id="placeOrder">Place Order</button>
            <button id="clearOrder">Clear Order</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="tuxedocat.js"></script>
</body>
</html>
